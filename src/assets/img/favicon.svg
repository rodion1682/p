<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Sons of Eternity compass flame emblem">
  <defs>
    <radialGradient id="navy"><stop offset="0" stop-color="#173653"/><stop offset=".58" stop-color="#091929"/><stop offset="1" stop-color="#030712"/></radialGradient>
    <linearGradient id="gold" x1=".12" y1="0" x2=".88" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#fff1c4"/><stop offset=".24" stop-color="#dca65d"/><stop offset=".51" stop-color="#614024"/><stop offset=".75" stop-color="#e8c38d"/><stop offset="1" stop-color="#80512d"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d8e9f6"/><stop offset=".4" stop-color="#455e78"/><stop offset=".74" stop-color="#131e32"/><stop offset="1" stop-color="#a4bed3"/></linearGradient>
    <radialGradient id="azure"><stop stop-color="#7eeeff"/><stop offset=".32" stop-color="#0bb8ff"/><stop offset=".75" stop-color="#0063c6"/><stop offset="1" stop-color="#00245d"/></radialGradient>
  </defs>

  <!-- Bold silhouetted eight-point compass, with extra-long vertical and horizontal rays. -->
  <path d="M64 2 75 25 64 41 53 25Z M64 126 53 103 64 87 75 103Z M2 64 25 53 41 64 25 75Z M126 64 103 75 87 64 103 53Z
           M20 20 46 31 48 46 31 48Z M108 20 97 46 82 48 80 31Z M20 108 31 80 46 82 48 97Z M108 108 80 97 82 82 97 80Z"
